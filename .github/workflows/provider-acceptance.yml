name: Live provider and Playwright acceptance

on:
  push:
    branches:
      - autonomous/production-hardening-20261114
    paths:
      - ".github/workflows/provider-acceptance.yml"

permissions:
  contents: read

jobs:
  provider-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate trusted runner code
        run: python -m py_compile agent_runner.py provider_api.py
      - name: Configure restricted sandbox egress
        run: |
          docker network create --driver bridge --subnet=172.31.240.0/24 --ipv6=false uba-agent-sandbox
          sudo iptables -N UBA_QA_EGRESS 2>/dev/null || true
          sudo iptables -F UBA_QA_EGRESS
          sudo iptables -C DOCKER-USER -s 172.31.240.0/24 -j UBA_QA_EGRESS 2>/dev/null || sudo iptables -I DOCKER-USER 1 -s 172.31.240.0/24 -j UBA_QA_EGRESS
          for cidr in 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4; do
            sudo iptables -A UBA_QA_EGRESS -d "$cidr" -j DROP
          done
          sudo iptables -A UBA_QA_EGRESS -j RETURN
          sudo iptables -I INPUT 1 -s 172.31.240.0/24 -j DROP
      - name: Build isolated Chromium image
        run: docker build --pull -f Dockerfile.sandbox -t uba-playwright-sandbox:local .
      - name: Execute real provider generation and browser scenarios
        env:
          PRIMARY_PROVIDER: openrouter
          OPENROUTER_API_KEY: \${{ secrets.OPENROUTER_API_KEY }}
          TARGET_URL: https://example.com
          BROWSER_SANDBOX_NETWORK: uba-agent-sandbox
          BROWSER_SANDBOX_IMAGE: uba-playwright-sandbox:local
          TASK_PROMPT: >-
            Open the supplied start URL in headless Chromium and verify its document title is "Example Domain".
            Then, in the same page, use page.set_content to create an in-memory browser QA fixture with:
            a search form containing input#search and button[type=submit], a div#search-result;
            a button#load-record and div#dynamic-result initially containing "Waiting...";
            an h1 initially containing "Page 1 of 2", a div#page-record initially containing "Record 1 of 2",
            and an a#next link. Add real JavaScript event handlers in the fixture:
            search submit prevents navigation and sets #search-result to "Found: browser automation" only after
            reading the input value; clicking #load-record asynchronously changes #dynamic-result after 250ms
            to "Loaded record: DYNAMIC-42"; clicking a#next prevents default navigation and changes the h1 to
            "Page 2 of 2" and #page-record to "Record 2 of 2: pagination verified".
            Use Playwright actions, not direct DOM mutation from Python, to run all three scenarios:
            fill and submit the search form then read the exact result text;
            click the dynamic button, wait for the exact inserted text using wait_for_function, then read it;
            click the Next link, wait for the exact page indicator, then read the page record.
            Verify every exact value against the expected strings. Save a full-page screenshot to artifacts/final.png
            and write output.json as a JSON object with success=true, result.search, result.dynamic_dom,
            result.pagination, and error=null only after all three DOM assertions pass.
            On any mismatch or exception, write success=false with a useful error and exit non-zero.
            Never hardcode the observed result values instead of reading them from the DOM; never fabricate success.
      - name: Run host-side acceptance assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("output.json").read_text(encoding="utf-8"))
          assert data.get("success") is True, "provider runner did not report success"
          result = data.get("result")
          assert isinstance(result, dict), "result must be a JSON object"
          expected = {
              "search": "Found: browser automation",
              "dynamic_dom": "Loaded record: DYNAMIC-42",
              "pagination": "Record 2 of 2: pagination verified",
          }
          for key, value in expected.items():
              assert result.get(key) == value, f"{key} result mismatch"
          print("All three browser scenarios passed for openrouter.")
          PY
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-provider-acceptance
          path: |
            output.json
            generated_task.py
            artifacts/
          if-no-files-found: warn
          retention-days: 14
