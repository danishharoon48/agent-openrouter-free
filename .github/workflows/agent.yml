name: Dynamic multilingual browser agent
run-name: Browser task ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      task_prompt:
        description: Browser task in any language; preserve literal UI text
        required: true
        type: string
      target_url:
        description: Initial HTTP or HTTPS URL
        required: true
        type: string
      request_id:
        description: Unique dashboard request identifier
        required: false
        default: manual
        type: string
      fallback_provider:
        description: Optional fallback provider (gemini, groq, openrouter, none)
        required: false
        default: none
        type: string
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PRIMARY_PROVIDER: openrouter
      TASK_PROMPT: ${{ inputs.task_prompt }}
      TARGET_URL: ${{ inputs.target_url }}
      FALLBACK_PROVIDER: ${{ inputs.fallback_provider }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate runner
        run: python -m py_compile agent_runner.py
      - name: Execute multilingual task
        run: python agent_runner.py --timeout 180
      - name: Upload output, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-agent-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output.json
            generated_task.py
            artifacts/
          if-no-files-found: warn
          retention-days: 14
